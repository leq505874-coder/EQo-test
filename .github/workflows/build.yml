
name: Build EQo APK

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: unzip -q q14-audio-lab.zip -d source

      - name: Build debug APK
        shell: bash
        run: |
          ANDROID_DIR="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Không tìm thấy Android Gradle project trong ZIP."
            find source -maxdepth 5 -type f | sort
            exit 1
          fi
          cd "$ANDROID_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EQo-debug-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
          

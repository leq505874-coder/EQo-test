
name: EQo ZIP Check

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP exists
        run: test -f q14-audio-lab.zip

      - name: List ZIP contents
        run: unzip -l q14-audio-lab.zip
        
